[project]
name = "payload-drones"
version = "0.1.0"
description = "Cooperative aerial payload transport in MJLab"
readme = "README.md"
authors = [{ name = "Varad Vaidya", email = "vaidyavarad2001@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "robotics-common[mjlab,rsl]",
    "numpy>=2.3",
    "matplotlib",
    # uv applies [tool.uv.sources] only to direct dependencies, so these are
    # listed here even though robotics-common pulls them in.
    "rsl-rl-lib",
    "torch==2.13.0+cu129",
]

[project.entry-points."mjlab.tasks"]
payload_drones = "payload_drones.config"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files exist to re-export. That is not an unused import.
"**/__init__.py" = ["F401"]

[dependency-groups]
dev = ["pytest"]

[tool.uv.sources]
robotics-common = { git = "https://github.com/varadVaidya/robotics-common.git", rev = "62ed0f3ccb5fa748cdd4ad3db40fd37b539eb26b" }
rsl-rl-lib = { git = "https://github.com/varadVaidya/rsl_rl.git", rev = "71030d9bdce215a4e1085426f4a0d1f8ed80184d" }
torch = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
