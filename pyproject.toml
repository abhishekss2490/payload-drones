[project]
name = "payload-drones"
version = "0.1.0"
description = "Cooperative aerial payload transport in MJLab"
readme = "README.md"
authors = [{ name = "Varad Vaidya", email = "vaidyavarad2001@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.3",
    "torch>=2.7",
]

[project.entry-points."mjlab.tasks"]
payload_drones = "payload_drones.config"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"
