[project]
name = "payload-drones"
version = "0.1.0"
description = "Physics scaffold for cooperative aerial payload transport"
readme = "RESEARCH_BRIEF.md"
authors = [{ name = "Varad Vaidya", email = "vaidyavarad2001@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "mj-adapt-drones",
    "mjlab>=1.3.0",
    "numpy>=2.4.4",
    "torch>=2.11.0",
    "warp-lang==1.12.1",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[project.entry-points."mjlab.tasks"]
payload_drones = "payload_drones.config"

[tool.uv.sources]
mj-adapt-drones = { path = "/scratch/robotics/mj-adapt-drones", editable = true }
torch = { index = "pytorch-cu129" }
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
